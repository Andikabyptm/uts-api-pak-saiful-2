$kind: http-request
url: "{{baseUrl}}/api/produk/{{produkId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200',()=>pm.response.to.have.status(200));
      pm.test('id sama',()=>pm.expect(pm.response.json().data.id).to.eql(Number(pm.environment.get('produkId'))));
    language: text/javascript
order: 3000
