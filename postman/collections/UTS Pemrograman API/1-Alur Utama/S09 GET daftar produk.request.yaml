$kind: http-request
url: "{{baseUrl}}/api/produk"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200',()=>pm.response.to.have.status(200));
      pm.test('Tidak memuat produkId',()=>{const j=pm.response.json();const id=Number(pm.environment.get('produkId'));pm.expect(j.data.every(p=>p.id!==id)).to.eql(true)});
    language: text/javascript
order: 9000
