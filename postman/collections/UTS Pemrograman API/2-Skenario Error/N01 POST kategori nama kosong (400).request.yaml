$kind: http-request
url: "{{baseUrl}}/api/kategori"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"nama_kategori":""}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400',()=>pm.response.to.have.status(400));
      pm.test('Body error',()=>{const j=pm.response.json();pm.expect(j.status).to.eql('error');pm.expect(j.message).to.be.a('string').and.not.empty});
      pm.test('errors terisi',()=>pm.expect(pm.response.json().errors).to.be.an('array').that.is.not.empty);
    language: text/javascript
order: 1000
