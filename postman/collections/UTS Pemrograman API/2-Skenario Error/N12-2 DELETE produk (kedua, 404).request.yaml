$kind: http-request
url: "{{baseUrl}}/api/produk/{{produkId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404',()=>pm.response.to.have.status(404));
      pm.test('Body error',()=>{const j=pm.response.json();pm.expect(j.status).to.eql('error');pm.expect(j.message).to.be.a('string').and.not.empty});
    language: text/javascript
order: 13000
