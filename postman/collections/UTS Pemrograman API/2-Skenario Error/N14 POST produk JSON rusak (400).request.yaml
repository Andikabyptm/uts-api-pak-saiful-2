$kind: http-request
url: "{{baseUrl}}/api/produk"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"kategori_id":1,"kode_produk":"RUSAK-1","nama_produk":"JSON Rusak","harga":10000,"stok":5,}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400',()=>pm.response.to.have.status(400));
      pm.test('Body error',()=>{const j=pm.response.json();pm.expect(j.status).to.eql('error');pm.expect(j.message).to.be.a('string').and.not.empty});
    language: text/javascript
order: 16000
